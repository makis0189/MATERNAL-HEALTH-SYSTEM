<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MHS</title>
    <link rel="icon" type="image" href="NJIKY/IMAGE/ICON.jpeg">
    <link rel="stylesheet" href="NJIKY/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="wrapper">
        <div class="left-image">
            <div class="brand">
                <img src="NJIKY/IMAGE/ICON.jpeg" class="logo">
                <h2>Maternal<br>Health System</h2>
            </div>
            <div class="image-content">
                <p> Better care for mothers,<br> brighter future for generations. </p>
            </div>
        </div>
        <div class="login-form">
            <div class="logform">
                <h2>Welcome Back!</h2>
                <p class="paragraph"> Sign in to continue to your account </p>
                <form class="loginform">
                    <div class="input">
                        <label for="email"> <strong>Email Address</strong> </label>
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="input">
                        <i class="fa-solid fa-lock"></i>
                        <label for="password"> <strong>Password</strong> </label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="input-option">
                        <div> <input type="checkbox" id="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <p> <a href="">Forgot password?</a> </p>
                    </div>
                    <button> SignIn </button>
                    <p class="or"> or continue with </p>
                    <div class="continue">
                        <a href=""><i class="fa-brands fa-google"></i>Google</a>
                        <a href=""><i class="fa-brands fa-microsoft"></i>Microsoft</a>
                    </div>
                </form>
                <p class="donthave"> Don't have an account? <a href="">Register here</a> </p>
                <footer><i class="fa-regular fa-copyright"></i>2026 Maternal Health System.All rights reserveds</footer>
            </div>
        </div>
        <div>
        </div>
    </div>
</body>
<script src="script.js">
</script>

</html>
